name: Pergunta ou relatório de bug
description: Envie uma pergunta ou relatório de bug para nos ajudar a melhorar o Aider
labels: []
body:
  - type: textarea
    attributes:
      label: Problema
      description: Descreva seu problema ou sua dúvida.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Versão e informações do modelo
      description: Informe a versão do Aider, o modelo utilizado (`gpt-4-xxx`, etc.) e quaisquer outras opções ou configurações que estejam ativas.
      placeholder: |
        Aider v0.XX.Y
        Modelo: gpt-N-... usando o formato de edição ????
        Repositório Git: .git com ### arquivos
        Mapa do repositório: usando #### tokens
    validations:
      required: false
